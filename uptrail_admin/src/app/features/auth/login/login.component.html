<div class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background Ambient Glows -->
  <div class="ambient-glow -top-40 -left-40 bg-indigo-600/20"></div>
  <div class="ambient-glow -bottom-40 -right-40 bg-violet-600/20"></div>

  <!-- Main Login Container -->
  <div class="w-full max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-linear-to-tr from-indigo-600 to-violet-500 shadow-lg shadow-indigo-500/25 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">Uptrail Admin</h1>
      <p class="text-slate-400 text-sm mt-1">Platform Administration & Management Portal</p>
    </div>

    <!-- Card Container -->
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <!-- Error Alert Banner using *ngIf -->
      <div *ngIf="errorMessage()" class="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-start gap-3">
        <svg class="w-5 h-5 text-rose-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <div class="flex-1">
          <span class="font-medium text-rose-200">Authentication Error</span>
          <p class="mt-0.5 text-xs text-rose-300">{{ errorMessage() }}</p>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Email Input using [(ngModel)] -->
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              placeholder="admin@uptrail.com"
              autocomplete="email"
              required
              class="w-full pl-11 pr-4 py-3 bg-slate-950/60 border rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-colors duration-200"
              [class.border-slate-800]="!isEmailInvalid()"
              [class.focus:border-indigo-500]="!isEmailInvalid()"
              [class.border-rose-500]="isEmailInvalid()"
              [class.focus:border-rose-500]="isEmailInvalid()"
            />
          </div>
          <p *ngIf="isEmailInvalid()" class="mt-1.5 text-xs text-rose-400">Please enter a valid email address.</p>
        </div>

        <!-- Password Input using [(ngModel)] -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
              Password
            </label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input
              id="password"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              class="w-full pl-11 pr-11 py-3 bg-slate-950/60 border rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none transition-colors duration-200"
              [class.border-slate-800]="!isPasswordInvalid()"
              [class.focus:border-indigo-500]="!isPasswordInvalid()"
              [class.border-rose-500]="isPasswordInvalid()"
              [class.focus:border-rose-500]="isPasswordInvalid()"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
              aria-label="Toggle password visibility"
            >
              <svg *ngIf="showPassword(); else eyeClosed" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
              <ng-template #eyeClosed>
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </ng-template>
            </button>
          </div>
          <p *ngIf="isPasswordInvalid()" class="mt-1.5 text-xs text-rose-400">Password is required.</p>
        </div>

        <!-- Submit Button with *ngIf else -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="w-full mt-2 py-3 px-4 rounded-xl bg-linear-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium text-sm shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 flex items-center justify-center gap-2"
        >
          <ng-container *ngIf="isLoading(); else defaultSubmitState">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Authenticating...</span>
          </ng-container>
          <ng-template #defaultSubmitState>
            <span>Sign In to Dashboard</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </ng-template>
        </button>
      </form>
    </div>

    <!-- Footer Info -->
    <p class="text-center text-xs text-slate-500 mt-6">
      Protected by Uptrail Identity & Access Control &copy; 2026
    </p>
  </div>
</div>
